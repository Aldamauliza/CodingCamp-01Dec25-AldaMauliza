<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
            integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
        <link rel="stylesheet" href="css/styles.css" />
        <script src="https://code.iconify.design/2/2.0.3/iconify.min.js"></script>
        <title>Responsive Portfolio Website</title>
    </head>
    <body>
        <!-- HEADER -->
        <header class="header" id="header">
            <nav class="nav container">
                <a href="#" class="nav__logo">Alda Mauliza</a>
                <div class="nav__menu" id="nav-menu">
                    <ul class="nav__list grid">
                        <li class="nav__item">
                            <a href="index.html" class="nav__link">
                                <i class="fal fa-home-lg-alt nav__icon"></i>
                                Home
                            </a>
                        </li>
                        <li class="nav__item">
                            <a href="index.html" class="nav__link">
                                <i class="far fa-user nav__icon"></i> About
                            </a>
                        </li>
                        <li class="nav__item">
                            <a href="index.html" class="nav__link">
                                <i class="fal fa-code nav__icon"></i> Skills
                            </a>
                        </li>
                        <li class="nav__item">
                            <a href="index.html" class="nav__link">
                                <i class="fal fa-code nav__icon"></i> Qualification
                            </a>
                        </li>
                        <li class="nav__item">
                            <a href="portofolio.html" class="nav__link">
                                <i class="fal fa-briefcase nav__icon"></i>
                                Portfolio
                            </a>
                        </li>
                        <li class="nav__item">
                            <a href="contact.html" class="nav__link">
                                <i class="fal fa-envelope nav__icon"></i>
                                Contact Me
                            </a>
                        </li>
                    </ul>
                    <i class="fal fa-times nav__close" id="nav-close"></i>
                </div>

                <div class="nav__btns">
                    <!-- theme button -->
                    <i class="far fa-moon change-theme" id="theme-button"></i>
                </div>
                <div class="nav__toggle" id="nav-toggle">
                        <i class="far fa-bars nav__icon"></i>
                    </div>
            </nav>
        </header>

        <main>
            <!-- CONTACT ME -->
            <section class="contact section" id="contact">
                <h2 class="section__title">Contact Me</h2>
                <span class="section__subtitle"></span>

                <div class="contact__container container grid">
                    <div>
                        <div class="contact__information">
                            <i class="far fa-phone-alt contact__icon"></i>

                            <div>
                                <h3 class="contact__title">Call Me</h3>
                                <span class="contact__subtitle">01234567891</span>
                            </div>
                        </div>

                        <div class="contact__information">
                            <i class="fal fa-envelope contact__icon"></i>

                            <div>
                                <h3 class="contact__title">Email</h3>
                                <span class="contact__subtitle">maulizaalda@gmail.com</span>
                            </div>
                        </div>

                        <div class="contact__information">
                            <i class="far fa-location contact__icon"></i>

                            <div>
                                <h3 class="contact__title">Location</h3>
                                <span class="contact__subtitle">Lhokseumawe, Aceh</span>
                            </div>
                        </div>
                    </div>

                    <form action="#" id="contact-form" class="contact__form grid">
                        <div class="contact__inputs grid">
                            <div class="contact__content">
                                <label for="" class="contact__label">Name</label>
                                <input type="text" class="contact__input" />
                            </div>
                            <div class="contact__content">
                                <label for="" class="contact__label">Email</label>
                                <input type="email" class="contact__input" />
                            </div>
                        </div>
                        <div class="contact__content">
                            <label for="" class="contact__label">Message</label>
                            <textarea cols="0" rows="7" class="contact__input"></textarea>
                        </div>
                        <div>
                            <button type="submit" class="button button--flex">
                                Send Message
                                <i class="fal fa-envelope button__icon"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="footer__bg">
                <div class="footer__container container grid">
                    <div>
                        <h1 class="footer__title">Alda Mauliza</h1>
                        <span class="footer__subtitle"> Junior Developer</span>
                    </div>

                    <ul class="footer__links">
                        <li>
                            <a href="portofolio.html" class="footer__link">Portfolio</a>
                        </li>
                        <li>
                            <a href="contact.html" class="footer__link">Contact</a>
                        </li>
                    </ul>

                    <div class="footer__socials">
                        <a href="https://www.facebook.com/" target="_blank" class="footer__social">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a href="https://www.instagram.com/" target="_blank" class="footer__social">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="https://twitter.com/" target="_blank" class="footer__social">
                            <span class="iconify" data-icon="icon-park-outline:twitter"></span>
                        </a>
                    </div>
                </div>

                <p class="footer__copy">&#169; All right reserved</p>
            </div>
        </footer>

        <!-- SCRIPT -->
        <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
        <script src="js/script.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const form = document.getElementById('contact-form');
                if (!form) return;

                form.addEventListener('submit', function (e) {
                    e.preventDefault();

                    // Buat toast
                    const toast = document.createElement('div');
                    toast.className = 'toast';
                    toast.innerHTML = '<strong>Success</strong><div class="toast__msg">Pesan berhasil dikirim.</div>';
                    document.body.appendChild(toast);

                    // tampilkan lalu hilangkan setelah 3 detik
                    requestAnimationFrame(() => toast.classList.add('toast--show'));
                    setTimeout(() => {
                        toast.classList.remove('toast--show');
                        setTimeout(() => toast.remove(), 300);
                    }, 3000);

                    // reset form
                    form.reset();
                });
            });
        </script>
    </body>
</html>
